<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Physique 2ème Info – T1 | الفيزياء</title>
<style>
:root{--bg:#f1f4fa;--sf:#fff;--sf2:#e9eef8;--ink:#0e1a2e;--mu:#586a85;--bd:#d9e1ef;--ac:#2d59e8;--ac2:#e3eaff;--am:#f5a524;--ok:#0f9d68;--no:#dc3b45;--pan:#0d1a33;--pf:#ffd27a;--sh:0 1px 2px rgba(14,26,46,.06),0 10px 26px -14px rgba(14,26,46,.22);--r:16px}
html[data-t=dark]{--bg:#080e1c;--sf:#0f1830;--sf2:#16223f;--ink:#e7edfb;--mu:#8fa1c0;--bd:#1f2d4f;--ac:#7f9dff;--ac2:#182450;--ok:#3ccf91;--no:#ff7a82;--pan:#050a16;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,system-ui,sans-serif;line-height:2}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.sb{position:fixed;inset-block:0;inset-inline-start:0;width:276px;background:var(--sf);border-inline-end:1px solid var(--bd);display:flex;flex-direction:column;padding:18px 14px;z-index:30;transition:transform .3s ease;overflow:auto}
.mn{margin-inline-start:276px;min-height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:2px 8px 16px}
.brand b{display:block;font-size:1.05rem;line-height:1.3}.brand small{color:var(--mu)}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ac),#6a4df0);color:#fff;display:grid;place-items:center}
nav{flex:1}.nh{margin:18px 12px 6px;font-size:.78rem;color:var(--mu);font-weight:600}
.ni{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;color:var(--mu);text-align:start;transition:background .2s,color .2s}
.ni span{flex:1;line-height:1.4}.ni:hover{background:var(--sf2);color:var(--ink)}.ni.on{background:var(--ac2);color:var(--ac);font-weight:600}.ni .ck{color:var(--ok);width:18px}
.sbf{display:flex;gap:12px;align-items:center;border-top:1px solid var(--bd);padding-top:14px}.sbf small{display:block;color:var(--mu)}
.tb{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;padding:12px 24px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);flex-wrap:wrap}
.srch{flex:1;min-width:140px;max-width:380px;position:relative;display:flex;align-items:center}
.srch .ic{position:absolute;inset-inline-start:12px;color:var(--mu)}
.srch input{width:100%;padding:9px 12px;padding-inline-start:40px;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
.seg{display:inline-flex;background:var(--sf2);border-radius:12px;padding:3px;margin-inline-start:auto}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;color:var(--mu);font-weight:600;white-space:nowrap}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:var(--sh)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);display:grid;place-items:center;transition:transform .2s,border-color .2s}
.ib:hover{border-color:var(--ac);transform:translateY(-1px)}.ib.on{background:var(--ac2);color:var(--ac)}
#bMenu{display:none}
.v{max-width:880px;margin:0 auto;padding:12px 24px 90px;animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.25;margin:.3em 0}
h2{font-size:1.3rem;margin:2em 0 .6em}
.lead{font-size:1.1rem;color:var(--mu)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;gap:6px;align-items:center;padding:2px 12px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:.85rem;font-weight:600}
.chip.g{background:var(--sf2);color:var(--mu)}.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.chip .ic{width:15px;height:15px}
.src{font-size:.85rem;color:var(--mu)}
.card,.lc,.tc,.ex,.hero2,.fgc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.note{border-radius:var(--r);padding:18px 20px;margin:18px 0}
.idea{background:var(--ac2);border-inline-start:4px solid var(--ac);font-size:1.08rem}.idea b{display:flex;gap:8px;align-items:center;color:var(--ac)}.idea p{margin:.4em 0 0}
.tl{list-style:none;padding:0;margin:0;counter-reset:s}.tl li{counter-increment:s;position:relative;padding-inline-start:54px;padding-bottom:22px}
.tl li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
.tl li::after{content:"";position:absolute;inset-inline-start:17px;top:42px;bottom:4px;width:2px;background:var(--bd)}.tl li:last-child::after{display:none}
.tl b{font-size:1.05rem}.tl p{margin:.2em 0}
.figs{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0}.fgc{flex:1 1 230px;text-align:center;padding:14px}.fgc small{display:block;color:var(--mu);margin-top:6px}.fgc svg{width:100%;max-width:280px;height:auto}
.tg,.mg,.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tc b{color:var(--ac)}.tc p{margin:.3em 0 0;color:var(--mu)}
.law{position:relative;background:var(--pan);color:#fff;border-radius:20px;padding:22px 24px;margin:14px 0;border:1px solid #23325a}
.fm{direction:ltr;text-align:center;color:var(--pf);font:600 clamp(1.5rem,5vw,2.3rem)/1.4 "Cambria Math","STIX Two Math",Georgia,serif;padding:6px 0 12px}
.law h4{margin:0 0 4px;font-size:1.02rem}.law p{margin:4px 0;color:#c3cee6;font-size:.93rem}.law p b{color:#fff}
.law .ib{position:absolute;top:12px;inset-inline-end:12px;width:34px;height:34px;background:#16254a;border-color:#2a3b6a;color:#fff}
.un{display:flex;gap:14px;background:var(--sf2);border-radius:var(--r);padding:16px 20px;margin:18px 0;align-items:flex-start}.un p{margin:.2em 0 0;direction:ltr;text-align:start}html[lang=ar] .un p{text-align:right}
.mc{display:flex;gap:10px;background:color-mix(in srgb,var(--no) 9%,var(--sf));border-inline-start:3px solid var(--no);border-radius:12px;padding:12px 14px}.mc .ic{color:var(--no)}
.ex{margin:12px 0}.lv{display:inline-block;padding:1px 12px;border-radius:99px;font-size:.82rem;font-weight:700;color:#fff}.l1{background:#0f9d68}.l2{background:#2d59e8}.l3{background:#d98a0b}.l4{background:#d6384a}
.gb,.pb{display:inline-flex;gap:8px;align-items:center;border-radius:12px;padding:9px 16px;font-weight:600;transition:transform .2s,box-shadow .2s}
.gb{border:1px solid var(--bd);background:var(--sf)}.gb:hover{border-color:var(--ac)}
.pb{border:0;background:var(--ac);color:#fff}.pb:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px var(--ac)}.pb:disabled,.gb:disabled{opacity:.4;pointer-events:none}
.sol{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.sol.show{grid-template-rows:1fr}.sol>div{overflow:hidden}
.sl{background:var(--sf2);border-radius:12px;padding:14px 16px;margin-top:12px;border-inline-start:3px solid var(--ok)}
.ck{padding-inline-start:20px}.ck li{margin:.3em 0}
.opt{display:block;width:100%;text-align:start;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:11px 14px;margin:7px 0;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--ac)}.opt.sel{border-color:var(--ac);background:var(--ac2)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--sf))}.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,var(--sf))}
.fb{background:var(--sf2);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.hero2{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.hero2 h1{margin:0}.ring{flex:none;color:var(--ink)}
.cg{margin-top:18px}.lc{display:flex;flex-direction:column;gap:8px;transition:transform .25s,box-shadow .25s}.lc:hover{transform:translateY(-3px)}.lc h3{margin:.2em 0}.lc p{margin:0;color:var(--mu);font-size:.93rem;flex:1}
.bar{height:8px;background:var(--sf2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .5s}
.fab{position:fixed;bottom:20px;inset-inline-end:20px;display:none;z-index:9}
.ov{display:none;position:fixed;inset:0;background:rgba(5,10,22,.55);z-index:20}
@media(max-width:900px){.sb{transform:translateX(-105%)}html[dir=rtl] .sb{transform:translateX(105%)}.sb.open{transform:none!important}.mn{margin-inline-start:0}.ov.show{display:block}#bMenu{display:grid}.tb{padding:10px 12px}.srch{order:9;flex:1 1 100%;max-width:none}.v{padding:8px 16px 90px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hide-sum .sum{display:none}
@media print{.sb,.tb,.ov,.fab,.noprint{display:none!important}.mn{margin:0}body{background:#fff}.card{box-shadow:none}}
</style></head>

<script>
const LA=[
{id:'l1',t:'الاستطاعة والطاقة الكهربائية',
intro:'نتعلم كيف نقيس «سرعة» استهلاك جهاز للكهرباء (الاستطاعة)، وكيف نحسب «كمية» ما استهلكه خلال مدة (الطاقة)، ولماذا تسخن الأسلاك والمقاومات.',
simple:'تخيّل صنبور ماء: قوة التدفق شيء، والكمية التي سالت خلال ساعة شيء آخر. في الكهرباء، الاستطاعة تشبه قوة التدفق (كم يستهلك الجهاز في كل ثانية)، والطاقة تشبه الكمية الكلية التي استهلكها خلال مدة معينة. مصباح 100 واط يستهلك أكثر في الثانية من مصباح 20 واط.',
terms:[['التوتر الكهربائي U','«الدفع» الذي يعطيه المولد للتيار. يقاس بالفولت (V). مثال: مأخذ الجدار في تونس ≈ 230 V.'],['شدة التيار I','كمية الشحنات الكهربائية التي تمر في الثانية. تقاس بالأمبير (A).'],['الاستطاعة P (Puissance)','الطاقة التي يستهلكها أو يوفرها جهاز في كل ثانية. تقاس بالواط (W).'],['الطاقة W (Énergie)','الكمية الكلية المستهلكة خلال مدة زمنية. تقاس بالجول (J) أو بالكيلواط ساعة (kWh).']],
laws:[['P = U × I','الاستطاعة الكهربائية لأي جهاز','P بالواط (W) ، U بالفولت (V) ، I بالأمبير (A)','نستعملها عندما نعرف التوتر والتيار.'],['W = P × Δt','الطاقة الكهربائية المستهلكة','W بالجول (J) ، P بالواط (W) ، Δt بالثانية (s)  — أو W بـ kWh إذا كانت P بـ kW و Δt بالساعة (h)','نستعملها لحساب الاستهلاك خلال مدة.'],['P = R × I²','استطاعة مقاومة (مفعول جول: تحويل الطاقة الكهربائية كلياً إلى حرارة)','R بالأوم (Ω)','تصح للمقاومة (الناقل الأومي) فقط، لا لكل جهاز.']],
units:'1 kW = 1000 W ؛ 1 h = 3600 s ؛ 1 kWh = 1000 W × 3600 s = 3 600 000 J = 3,6 × 10⁶ J ؛ 1 W = 1 J/s.',
ex:[
{lv:1,q:'مصباح يعمل تحت توتر 230 V ويمر فيه تيار 0,26 A. احسب استطاعته.',s:'القانون: P = U × I لأننا نعرف التوتر والتيار.<br>التعويض: P = 230 × 0,26 = 59,8 W.<br>النتيجة: P ≈ 60 W.'},
{lv:2,q:'جهاز استطاعته 100 W يعمل 5 ساعات. احسب طاقته بالـ kWh ثم بالجول.',s:'نحوّل: 100 W = 0,1 kW.<br>W = P × Δt = 0,1 × 5 = 0,5 kWh.<br>بالجول: 0,5 × 3,6×10⁶ = 1,8×10⁶ J.<br>تحقق: 100 W × (5×3600 s) = 100 × 18000 = 1 800 000 J ✔.'},
{lv:3,q:'غلاية كهربائية استطاعتها 2000 W تحت 230 V. (أ) احسب شدة التيار. (ب) احسب الطاقة المستهلكة في 3 دقائق بالجول وبالـ kWh.',s:'(أ) من P = U×I نستخرج I = P/U = 2000/230 ≈ 8,7 A.<br>(ب) Δt = 3×60 = 180 s.<br>W = P×Δt = 2000 × 180 = 360 000 J.<br>بالـ kWh: 360 000 / 3,6×10⁶ = 0,1 kWh (تحقق: 2 kW × 0,05 h = 0,1 ✔).'},
{lv:4,q:'مقاومة R = 50 Ω يمر فيها تيار 2 A. (أ) احسب استطاعتها بطريقتين. (ب) احسب الطاقة الحرارية المحررة في 10 دقائق.',s:'(أ) الطريقة 1: P = R×I² = 50 × 2² = 200 W.<br>الطريقة 2: U = R×I = 50×2 = 100 V ثم P = U×I = 100×2 = 200 W ✔ (النتيجتان متطابقتان).<br>(ب) Δt = 600 s ، W = 200 × 600 = 120 000 J = 1,2×10⁵ J (≈ 0,033 kWh).'}],
mistakes:['نسيان تحويل الدقائق أو الساعات إلى ثوانٍ عند استعمال الجول.','الخلط بين الواط (استطاعة) والكيلواط ساعة (طاقة).','استعمال P = R×I² لجهاز ليس مقاومة صرفة.','نسيان كتابة الوحدة في النتيجة.'],
sum:['الاستطاعة P = U·I (W)','الطاقة W = P·Δt (J أو kWh)','1 kWh = 3,6×10⁶ J','مفعول جول: P = R·I² للمقاومة','حوّل الزمن إلى ثوانٍ عند حساب الجول'],
quiz:[{q:'وحدة الاستطاعة في النظام الدولي هي:',o:['الجول','الواط','الفولت','الأمبير'],c:1,e:'الواط (W) = جول/ثانية. الجول وحدة الطاقة.'},{q:'جهاز تحت 12 V وتياره 2 A، استطاعته:',o:['6 W','14 W','24 W','0,17 W'],c:2,e:'P = U×I = 12×2 = 24 W.'},{q:'1 kWh يساوي:',o:['1000 J','3600 J','3,6×10⁶ J','3,6×10³ J'],c:2,e:'1000 W × 3600 s = 3 600 000 J.'},{q:'صح أم خطأ: الطاقة المستهلكة تتضاعف إذا ضاعفنا مدة التشغيل مع ثبات الاستطاعة.',o:['صح','خطأ'],c:0,e:'W = P×Δt؛ W متناسبة طردياً مع Δt.'},{q:'مقاومة 10 Ω يمر فيها 3 A. استطاعتها:',o:['30 W','90 W','13 W','3,3 W'],c:1,e:'P = R×I² = 10×9 = 90 W (وليس 10×3).'}]},

{id:'l2',t:'المقاومة الكهربائية وقانون أوم',
intro:'نتعلم ما هي المقاومة، العلاقة بين التوتر والتيار فيها (قانون أوم)، وكيف نعوّض عدة مقاومات بمقاومة واحدة (التركيب على التوالي وعلى التوازي).',
simple:'اعتبر السلك أنبوباً يمر فيه الماء. الأنبوب الضيق «يقاوم» مرور الماء أكثر. المقاومة الكهربائية تقيس «ضيق» الطريق أمام التيار: كلما كبرت المقاومة قلّ التيار تحت نفس التوتر.',
terms:[['المقاومة R (Résistance)','خاصية الناقل الأومي التي تحدّ من مرور التيار. تقاس بالأوم (Ω).'],['الناقل الأومي (Conducteur ohmique)','عنصر يتناسب فيه التوتر طردياً مع التيار؛ منحناه U=f(I) مستقيم يمر من الأصل.'],['التركيب على التوالي','مقاومات متتالية في نفس الفرع: يمر فيها نفس التيار.'],['التركيب على التوازي','مقاومات في فروع متقابلة: لها نفس التوتر بين طرفيها.']],
laws:[['U = R × I','قانون أوم للناقل الأومي','U بالفولت (V) ، R بالأوم (Ω) ، I بالأمبير (A)','لإيجاد U أو I أو R عندما نعرف الكميتين الأخريين.'],['R = R₁ + R₂ (+ …)','المقاومة المكافئة على التوالي','كلها بالأوم (Ω)','عند ربط مقاومات في سلسلة؛ التيار نفسه فيها وتتجمع التوترات.'],['1/R = 1/R₁ + 1/R₂','المقاومة المكافئة على التوازي (لمقاومتين: R = R₁R₂/(R₁+R₂))','كلها بالأوم (Ω)','عند ربط فروع متقابلة؛ التوتر نفسه وتتجمع التيارات.']],
units:'1 kΩ = 1000 Ω ؛ 1 MΩ = 10⁶ Ω ؛ 1 mA = 10⁻³ A.',
ex:[
{lv:1,q:'ناقل أومي R = 100 Ω يمر فيه تيار 0,05 A. احسب التوتر بين طرفيه.',s:'القانون: U = R×I.<br>U = 100 × 0,05 = 5 V.'},
{lv:2,q:'احسب المقاومة المكافئة لـ R₁ = 100 Ω و R₂ = 220 Ω على التوالي.',s:'على التوالي نجمع: R = 100 + 220 = 320 Ω.<br>ملاحظة: المكافئة أكبر من كل مقاومة منفردة.'},
{lv:3,q:'احسب المقاومة المكافئة لـ 60 Ω و 30 Ω على التوازي.',s:'R = (60×30)/(60+30) = 1800/90 = 20 Ω.<br>تحقق: 1/60 + 1/30 = 1/60 + 2/60 = 3/60 = 1/20 ✔.<br>ملاحظة: المكافئة أصغر من أصغر مقاومة (30 Ω) ✔.'},
{lv:4,q:'نطبق توتراً U = 12 V بين طرفي مقاومتين R₁ = 40 Ω و R₂ = 60 Ω مركبتين على التوازي. احسب المقاومة المكافئة، التيار الكلي، والتيار في كل فرع.',s:'R = (40×60)/(100) = 24 Ω.<br>التيار الكلي: I = U/R = 12/24 = 0,5 A.<br>في الفرعين نفس التوتر 12 V: I₁ = 12/40 = 0,30 A ، I₂ = 12/60 = 0,20 A.<br>تحقق: I₁ + I₂ = 0,5 A = I ✔.'}],

const LF=[
{id:'l1',t:"Puissance et énergie électrique",
intro:"Nous allons apprendre à mesurer la « vitesse » à laquelle un appareil consomme l'électricité (la puissance), à calculer la quantité consommée pendant une durée (l'énergie) et à comprendre pourquoi les fils et les résistors chauffent.",
simple:"Imagine un robinet : la force du jet est une chose, la quantité d'eau écoulée en une heure en est une autre. En électricité, la puissance est la force du jet (combien l'appareil consomme chaque seconde) et l'énergie est la quantité totale consommée pendant une durée. Une lampe de 100 W consomme plus par seconde qu'une lampe de 20 W.",
terms:[["Tension électrique U","La « poussée » que le générateur donne au courant. Elle se mesure en volt (V). Exemple : la prise de courant en Tunisie ≈ 230 V."],["Intensité du courant I","Quantité de charges électriques qui traversent le fil chaque seconde. Elle se mesure en ampère (A)."],["Puissance P","Énergie qu'un appareil consomme ou fournit chaque seconde. Elle se mesure en watt (W)."],["Énergie W","Quantité totale consommée pendant une durée. Elle se mesure en joule (J) ou en kilowattheure (kWh)."]],
laws:[["P = U × I","Puissance électrique d'un appareil","P en watt (W), U en volt (V), I en ampère (A)","Quand on connaît la tension et le courant."],["W = P × Δt","Énergie électrique consommée","W en joule (J), P en watt (W), Δt en seconde (s) — ou W en kWh si P est en kW et Δt en heure (h)","Pour calculer la consommation pendant une durée."],["P = R × I²","Puissance d'un résistor (effet Joule : toute l'énergie électrique devient chaleur)","R en ohm (Ω)","Valable seulement pour un résistor, pas pour tout appareil."]],

{lv:2,q:"Un appareil de puissance 100 W fonctionne 5 heures. Calculer son énergie en kWh puis en joules.",s:"Conversion : 100 W = 0,1 kW.<br>W = P × Δt = 0,1 × 5 = 0,5 kWh.<br>En joules : 0,5 × 3,6×10⁶ = 1,8×10⁶ J.<br>Vérification : 100 × (5×3600) = 1 800 000 J ✔."},
{lv:3,q:"Une bouilloire de 2000 W fonctionne sous 230 V. (a) Calculer l'intensité du courant. (b) Calculer l'énergie consommée en 3 minutes, en joules puis en kWh.",s:"(a) De P = U×I on tire I = P/U = 2000/230 ≈ 8,7 A.<br>(b) Δt = 3×60 = 180 s.<br>W = 2000 × 180 = 360 000 J.<br>En kWh : 360 000 / 3,6×10⁶ = 0,1 kWh (vérif. : 2 kW × 0,05 h = 0,1 ✔)."},

{id:'l2',t:"Résistance électrique et loi d'Ohm",
intro:"Nous allons voir ce qu'est une résistance, la relation entre tension et courant (loi d'Ohm) et comment remplacer plusieurs résistors par un seul (association en série et en dérivation).",
simple:"Imagine un fil comme un tuyau où coule de l'eau. Un tuyau étroit « résiste » davantage au passage. La résistance électrique mesure l'« étroitesse » du chemin offert au courant : plus elle est grande, plus le courant est faible sous la même tension.",
terms:[["Résistance R","Propriété d'un résistor qui limite le passage du courant. Elle se mesure en ohm (Ω)."],["Conducteur ohmique (résistor)","Élément pour lequel la tension est proportionnelle au courant ; la courbe U=f(I) est une droite passant par l'origine."],["Association en série","Résistors l'un après l'autre sur la même branche : ils sont traversés par le même courant."],["Association en dérivation (parallèle)","Résistors sur des branches opposées : ils ont la même tension entre leurs bornes."]],

LA[0].steps=[['الكهرباء حركة','داخل الأسلاك شحنات صغيرة جداً لا نراها، وعندما تتحرك نسمي حركتها «تياراً كهربائياً». نرى أثرها فقط: ضوء المصباح أو حرارة المكواة.'],['ما الذي يدفعها؟','البطارية أو المأخذ يعمل مثل مضخة ماء تدفع الشحنات. قوة الدفع تسمى «التوتر» U ونقيسها بالفولت.'],['كم يمر منها؟','«شدة التيار» I هي كمية الشحنات التي تمر كل ثانية. نقيسها بالأمبير. تشبه كمية الماء التي تعبر الأنبوب في الثانية.'],['كيف نعرف ما يستهلكه الجهاز؟','كلما كان الدفع أقوى (U كبير) ومرّ تيار أكبر (I كبير) استهلك الجهاز أكثر في الثانية. نضرب الاثنين فنحصل على الاستطاعة: P = U × I.'],['من الاستطاعة إلى الطاقة','الاستطاعة تخبرنا بما يُستهلك في ثانية واحدة. إذا استمر الجهاز ساعات فنضرب في الزمن: W = P × Δt. هذا ما تحسبه الستاغ في فاتورتك بالـ kWh.']];
LF[0].steps=[["L'électricité est un mouvement","Dans les fils, il y a de minuscules charges invisibles. Quand elles se déplacent, on parle de « courant électrique ». On ne voit que ses effets : la lumière d'une lampe ou la chaleur d'un fer à repasser."],["Qui les pousse ?","La pile ou la prise fonctionne comme une pompe à eau qui pousse les charges. La force de cette poussée s'appelle la « tension » U, en volt."],["Combien passent ?","L'« intensité » I est la quantité de charges qui passent chaque seconde. Elle se mesure en ampère, comme le débit d'eau d'un tuyau."],["Comment savoir ce que consomme l'appareil ?","Plus la poussée est forte (U grand) et plus le courant est grand (I grand), plus l'appareil consomme par seconde. On multiplie les deux : la puissance P = U × I."],["De la puissance à l'énergie","La puissance dit ce qui est consommé en une seconde. Si l'appareil fonctionne des heures, on multiplie par la durée : W = P × Δt. C'est ce que la STEG calcule sur ta facture, en kWh."]];
LA[1].steps=[['كل جهاز يعيق التيار قليلاً','عندما يمر التيار في سلك رفيع أو في خيط مصباح، يجد صعوبة في العبور. هذه الصعوبة اسمها «المقاومة» R ونقيسها بالأوم Ω.'],['العلاقة بين التوتر والتيار','إذا ضاعفنا الدفع (U) على نفس المقاومة يتضاعف التيار (I). الكميتان متناسبتان، ومن هنا قانون أوم: U = R × I.'],['مقاومتان على التوالي','كأنك تمشي في طريق واحد فيه حاجزان متتاليان: الصعوبة تتجمع. لذلك نجمع: R = R₁ + R₂.'],['مقاومتان على التوازي','كأن هناك طريقين متقابلين: التيار يختار أيهما شاء فيصبح العبور أسهل. لذلك المقاومة المكافئة أصغر من كل منهما.']];
LF[1].steps=[["Tout appareil gêne un peu le courant","Quand le courant traverse un fil fin ou le filament d'une lampe, il a du mal à passer. Cette difficulté s'appelle la « résistance » R, en ohm Ω."],["Lien entre tension et courant","Si on double la poussée (U) sur la même résistance, le courant (I) double. Les deux sont proportionnels, d'où la loi d'Ohm : U = R × I."],["Deux résistors en série","C'est un seul chemin avec deux barrières successives : les difficultés s'additionnent. Donc R = R₁ + R₂."],["Deux résistors en dérivation","C'est comme deux chemins côte à côte : le courant choisit, le passage est plus facile. La résistance équivalente est plus petite que chacune."]];

srcH:`<h2>المصادر والتنبيهات</h2><p><b>ما تأكدت منه (مصدران مستقلان على الأقل):</b> فهرس mathinfo.tn وفهرس INJEZ يضعان في الثلاثي الأول: الاستطاعة والطاقة الكهربائية، ثم الموصلية والمستقبلات السلبية وتركيب المقاومات. وتؤكد فهارس Devoir.TN وKademia وTopnetSchool أن هذين الدرسين في بداية المنهج. وتوجد في الثلاثي الأول أيضاً دروس كيمياء (الذرة وتوزيع الإلكترونات) خارج هذه المنصة.</p><p><b>ما لم يتأكد:</b> يضع INJEZ وTadris أيضاً «المستقبلات النشيطة» و«المولد» (ونقطة التشغيل/قانون بويي) ضمن هذا المحور، لكن mathinfo لا يذكرها في الثلاثي الأول. لم أدرجها بعد، وستُضاف إذا أكدها أستاذك.</p><p><b>تنبيه:</b> لم أتمكن من فتح الكتاب الرسمي (CNP 223272) نفسه. الشرح والأمثلة والتمارين من إعدادي لا من الكتاب، فراجع كتابك ودفترك.</p>`},

const P={bolt:'M13 2 3 14h9l-1 8 10-12h-9l1-8z',grid:'M3 3h7v7H3z M14 3h7v7h-7z M14 14h7v7h-7z M3 14h7v7H3z',fn:'M8 3H6a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h2 M16 3h2a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-2',check:'M22 11.1V12a10 10 0 1 1-5.9-9.1 M22 4 12 14l-3-3',target:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12z M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',info:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M12 16v-4 M12 8h.01',search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.3-4.3',moon:'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',printer:'M6 9V2h12v7 M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2 M6 14h12v8H6z',copy:'M9 9h11v11H9z M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1',menu:'M3 6h18M3 12h18M3 18h18',eye:'M2 12s4-8 10-8 10 8 10 8-4 8-10 8-10-8-10-8z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',warn:'M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z M12 9v4 M12 17h.01',up:'M12 19V5 M5 12l7-7 7 7',prev:'M15 18l-6-6 6-6',next:'M9 18l6-6-6-6'};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const state=(()=>{try{return JSON.parse(localStorage.getItem('p2i3')||'{}')}catch(e){return{}}})();
const save=()=>{try{localStorage.setItem('p2i3',JSON.stringify(state))}catch(e){}};
state.done=state.done||{};state.best=state.best||{};
let lang=state.lang==='ar'?'ar':'fr',L=lang==='fr'?LF:LA,cur='l1';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),main=$('#main'),nav=$('#nav'),T=k=>D[lang][k];
const pct=()=>Math.round(L.filter(l=>state.done[l.id]).length/L.length*100);
const ring=(p,s,big)=>{const r=44,c=2*Math.PI*r;return`<svg class="ring" width="${s}" height="${s}" viewBox="0 0 100 100" role="img" aria-label="${p}%"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--bd)" stroke-width="9"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 50 50)"/>${big?`<text x="50" y="58" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">${p}%</text>`:''}</svg>`};
const tri=(t,a,b)=>`<svg viewBox="0 0 200 150" role="img"><path d="M100 10 190 140H10z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M45 90H155M100 90v50" stroke="currentColor" stroke-width="2"/><g font-size="32" font-weight="700" text-anchor="middle" font-family="Georgia,serif"><text x="100" y="75" fill="var(--am)">${t}</text><text x="68" y="126" fill="var(--ac)">${a}</text><text x="132" y="126" fill="var(--ac)">${b}</text></g></svg>`;
const rs=(x,y,t)=>`<rect x="${x}" y="${y}" width="50" height="20" rx="3" fill="var(--sf)" stroke="currentColor" stroke-width="2"/><text x="${x+25}" y="${y-6}" text-anchor="middle" font-size="14" fill="currentColor">${t}</text>`;
const serie=`<svg viewBox="0 0 300 100" role="img"><path d="M10 55H70M120 55H170M220 55H290" stroke="currentColor" stroke-width="2" fill="none"/>${rs(70,45,'R₁')}${rs(170,45,'R₂')}<text x="18" y="42" font-size="14" fill="var(--am)">I →</text></svg>`;
const para=`<svg viewBox="0 0 300 110" role="img"><path d="M10 55H60V25H120M180 25H240V85H180M120 85H60V25M60 55V85M240 55H290M240 25V55" stroke="currentColor" stroke-width="2" fill="none"/>${rs(120,15,'R₁')}${rs(120,75,'R₂')}</svg>`;
const fig=(s,c)=>`<div class="fgc">${s}<small>${c}</small></div>`;
const figs=id=>id==='l1'?fig(tri('P','U','I'),T('fig1')):fig(tri('U','R','I'),T('fig2'))+fig(serie,T('figS'))+fig(para,T('figP'));
function applyLang(){const h=document.documentElement;h.lang=lang;h.dir=lang==='ar'?'rtl':'ltr';L=lang==='ar'?LA:LF;$('#q').placeholder=T('search');$('#q').value='';$('#brand').innerHTML=`<div class="logo">${ic('bolt')}</div><div><b>${T('brandT')}</b><small>${T('tag')}</small></div>`;$$('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));[['bTheme','theme'],['bPrint','print'],['bSum',document.body.classList.contains('hide-sum')?'showSum':'hideSum'],['bMenu','menu'],['top','top']].forEach(([i,k])=>{const e=$('#'+i);e.title=T(k);e.setAttribute('aria-label',T(k))})}
function nav_(){const it=(id,i,t,x='')=>`<button class="ni ${id===cur?'on':''}" onclick="go('${id}')">${ic(i)}<span>${t}</span>${x}</button>`;
nav.innerHTML=it('dash','grid',T('dash'))+`<p class="nh">${T('lessonsT')}</p>`+L.map((l,i)=>it(l.id,'bolt',(i+1)+'. '+l.t,state.done[l.id]?ic('check','ck'):'')).join('')+`<p class="nh">${T('tools')}</p>`+it('laws','fn',T('laws'))+it('quiz','target',T('quiz'))+it('all','list',T('all'))+it('src','info',T('src'));
$('#sbf').innerHTML=`${ring(pct(),46,0)}<div><b>${pct()}%</b><small>${T('overall')}</small></div>`}
function go(id){cur=id;nav_();render();scrollTo(0,0);$('#sb').classList.remove('open');$('#ov').classList.remove('show')}
function render(){const i=L.findIndex(l=>l.id===cur);if(i>=0)return lesson(i);if(cur==='dash')return dash();if(cur==='laws')return laws();if(cur==='quiz')return void(main.innerHTML='<section class="v"><div class="card" id="qa"></div></section>',quiz(L.flatMap(l=>l.quiz),T('qzAll'),$('#qa'),null));if(cur==='all')return allSum();main.innerHTML=`<section class="v"><div class="card">${T('srcH')}</div></section>`}
function dash(){const dn=L.filter(l=>state.done[l.id]).length,nx=L.find(l=>!state.done[l.id])||L[0];
main.innerHTML=`<section class="v"><div class="hero2">${ring(pct(),120,1)}<div><h1>${T('dash')}</h1><p>${dn} / ${L.length} ${T('doneN')}</p><button class="pb" onclick="go('${nx.id}')">${T('cont')} ${ic(lang==='ar'?'prev':'next')}</button></div></div>
<div class="cg">${L.map((l,i)=>`<article class="lc"><span class="chip" style="align-self:flex-start">${i+1}</span><h3>${l.t}</h3><p>${l.intro}</p><div class="bar"><i style="width:${state.done[l.id]?100:0}%"></i></div><small>${state.best[l.id]!=null?T('best')+': '+state.best[l.id]+'%':T('noScore')}</small><button class="pb" onclick="go('${l.id}')">${T(state.done[l.id]?'review':'start')}</button></article>`).join('')}</div></section>`}
const lawCard=(w,i,k)=>`<div class="law"><div class="fm">${w[0]}</div><h4>${w[1]}</h4><p><b>${T('symb')}:</b> ${w[2]}.</p><p><b>${T('when')}</b> ${w[3]}</p><button class="ib noprint" onclick="cp1(${i},${k})" aria-label="${T('copy')}" title="${T('copy')}">${ic('copy')}</button></div>`;
function lesson(i){const l=L[i];
main.innerHTML=`<section class="v"><header><div class="chips"><span class="chip">${T('tag')}</span><span class="chip g">${i+1} / ${L.length}</span>${state.done[l.id]?`<span class="chip ok">${ic('check')}${T('done')}</span>`:''}</div><h1>${l.t}</h1><p class="lead">${l.intro}</p><p class="src">${T('mine')}</p></header>
<div class="note idea"><b>${ic('bolt')}${T('idea')}</b><p>${l.simple}</p></div>
<h2>${T('steps')}</h2><ol class="tl">${l.steps.map(s=>`<li><b>${s[0]}</b><p>${s[1]}</p></li>`).join('')}</ol>
<div class="figs">${figs(l.id)}</div>
<h2>${T('terms')}</h2><div class="tg">${l.terms.map(t=>`<div class="tc"><b>${t[0]}</b><p>${t[1]}</p></div>`).join('')}</div>
<h2>${T('lawsH')}</h2>${l.laws.map((w,k)=>lawCard(w,i,k)).join('')}
<div class="un">${ic('target')}<div><b>${T('unitsH')}</b><p>${l.units}</p></div></div>
<h2>${T('mist')}</h2><div class="mg">${l.mistakes.map(m=>`<div class="mc">${ic('warn')}<span>${m}</span></div>`).join('')}</div>
<h2>${T('exH')}</h2><div class="row noprint"><button class="gb" onclick="allSol(true)">${T('showAllS')}</button><button class="gb" onclick="allSol(false)">${T('hideAllS')}</button></div>
${l.ex.map(e=>`<div class="ex"><span class="lv l${e.lv}">${T('lvl')} ${e.lv}</span><p>${e.q}</p><button class="gb noprint" onclick="tg(this)">${ic('eye')}${T('tog')}</button><div class="sol"><div><div class="sl">${e.s}</div></div></div></div>`).join('')}
<div class="card sum" style="margin-top:22px"><h2 style="margin-top:0">${T('sumH')}</h2><ul class="ck">${l.sum.map(s=>`<li>${s}</li>`).join('')}</ul></div>
<div class="card noprint" id="qz" style="margin-top:22px"></div>
<div class="row noprint"><button class="gb" ${i?'':'disabled'} onclick="go('${L[i-1]?.id||''}')">${ic(lang==='ar'?'next':'prev')}${T('prev')}</button><button class="pb" onclick="mark('${l.id}')">${ic('check')}${T(state.done[l.id]?'unmark':'mark')}</button><button class="gb" ${i<L.length-1?'':'disabled'} onclick="go('${L[i+1]?.id||''}')">${T('next')}${ic(lang==='ar'?'prev':'next')}</button></div></section>`;
quiz(l.quiz,T('qz'),$('#qz'),l.id)}
function tg(b){b.nextElementSibling.classList.toggle('show')}
function mark(id){state.done[id]=!state.done[id];save();go(id)}
function allSol(v){$$('.sol').forEach(s=>s.classList.toggle('show',v))}
function cp1(i,k){const w=L[i].laws[k];copy(w[0]+'  ('+w[1]+')')}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert(T('copied'))).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');alert(T('copied'))}catch(e){alert(T('cfail'))}a.remove()})}
function copyAll(){copy(L.flatMap(l=>l.laws.map(w=>w[0]+'  ('+w[1]+')')).join('\n'))}
function laws(){main.innerHTML=`<section class="v"><h1>${T('allT')}</h1><div class="row noprint"><button class="pb" onclick="copyAll()">${ic('copy')}${T('copyAll')}</button></div>${L.map((l,i)=>`<h2>${l.t}</h2>${l.laws.map((w,k)=>lawCard(w,i,k)).join('')}`).join('')}</section>`}
function sumHtml(){return L.map(l=>`<h2>${l.t}</h2><ul class="ck">${l.sum.map(s=>`<li>${s}</li>`).join('')}</ul><p><b>${T('unitsL')}:</b> <span dir="ltr">${l.units}</span></p>`).join('')}
function allSum(){main.innerHTML=`<section class="v"><div class="card sum"><h1>${T('allS')}</h1>${sumHtml()}</div></section>`}
function quiz(Q,title,host,id){const box=host;let ans=Array(Q.length).fill(-1);
const draw=done=>{box.innerHTML=`<h2 style="margin-top:0">${title}</h2>`+Q.map((q,i)=>`<div style="margin:16px 0"><b>${i+1}. ${q.q}</b>${q.o.map((o,j)=>{let c='opt';if(done){if(j===q.c)c+=' right';else if(ans[i]===j)c+=' wrong'}else if(ans[i]===j)c+=' sel';return`<button class="${c}" data-i="${i}" data-j="${j}">${o}</button>`}).join('')}${done?`<div class="fb">${ans[i]===q.c?T('ok'):T('ko')+(ans[i]<0?T('none'):T('yours')+' «'+q.o[ans[i]]+'» '+T('wrongw'))}${T('right')} «${q.o[q.c]}». ${q.e}</div>`:''}</div>`).join('')+(done?(()=>{const s=Q.filter((q,i)=>ans[i]===q.c).length;return`<h2>${T('score')}: ${s}/${Q.length} (${Math.round(s/Q.length*100)}%)</h2><button class="pb" id="rt">${T('retry')}</button>`})():`<button class="pb" id="ck">${T('check')}</button>`);
box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;ans[+b.dataset.i]=+b.dataset.j;draw(false)});
const c=box.querySelector('#ck');if(c)c.onclick=()=>{if(id){const p=Math.round(Q.filter((q,i)=>ans[i]===q.c).length/Q.length*100);state.best[id]=Math.max(state.best[id]||0,p);save()}draw(true)};
const r=box.querySelector('#rt');if(r)r.onclick=()=>{ans=Array(Q.length).fill(-1);draw(false)}};draw(false)}
$$('#seg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;state.lang=lang;save();applyLang();nav_();render()});
$('#bTheme').onclick=()=>{const d=document.documentElement;const n=d.dataset.t==='dark'?'light':'dark';d.dataset.t=n;state.theme=n;save()};
$('#bSum').onclick=()=>{const h=document.body.classList.toggle('hide-sum');$('#bSum').classList.toggle('on',h);applyLang()};
$('#bPrint').onclick=()=>{const h=main.innerHTML;main.innerHTML=`<section class="v"><div class="card sum"><h1>${T('prT')}</h1>${sumHtml()}</div></section>`;document.body.classList.remove('hide-sum');print();main.innerHTML=h;applyLang();render()};
$('#bMenu').onclick=()=>{$('#sb').classList.add('open');$('#ov').classList.add('show')};$('#ov').onclick=()=>{$('#sb').classList.remove('open');$('#ov').classList.remove('show')};
$('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase();if(!v)return render();const r=L.flatMap(l=>[...l.terms.map(t=>[l.t,t[0],t[1]]),...l.laws.map(w=>[l.t,w[0],w[1]]),...l.ex.map(x=>[l.t,T('lvl')+' '+x.lv,x.q])]).filter(x=>x.join(' ').toLowerCase().includes(v));main.innerHTML=`<section class="v"><h1>${T('res')} (${r.length})</h1>${r.map(x=>`<div class="card" style="margin:10px 0"><span class="chip g">${x[0]}</span> <b>${x[1]}</b><p style="margin:.3em 0 0">${x[2]}</p></div>`).join('')||`<p>${T('nores')}</p>`}</section>`};
$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});addEventListener('scroll',()=>{$('#top').style.display=scrollY>400?'grid':'none'});
if(state.theme)document.documentElement.dataset.t=state.theme;else if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.t='dark';
applyLang();nav_();render();
</script></body></html>
